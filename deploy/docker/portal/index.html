<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PGO 组件导航</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f2f5f3;
            --surface: rgba(255, 255, 255, 0.88);
            --text: #18332b;
            --muted: #63746e;
            --line: rgba(24, 51, 43, 0.12);
            --accent: #167b62;
            --accent-soft: #dff3eb;
            --online: #13795b;
            --offline: #b84737;
            --pending: #7b6b32;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                "Segoe UI", sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            background:
                radial-gradient(circle at 12% 6%, rgba(117, 196, 161, 0.22), transparent 32rem),
                radial-gradient(circle at 88% 92%, rgba(64, 125, 108, 0.15), transparent 30rem),
                var(--bg);
        }

        main {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 72px 0;
        }

        header { margin-bottom: 36px; }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 750;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(34px, 6vw, 62px);
            line-height: 1.05;
            letter-spacing: -0.045em;
        }

        .intro {
            max-width: 660px;
            margin: 18px 0 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.7;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
        }

        .card {
            position: relative;
            display: flex;
            min-height: 190px;
            flex-direction: column;
            padding: 24px;
            overflow: hidden;
            color: inherit;
            text-decoration: none;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: 0 18px 50px rgba(31, 65, 55, 0.07);
            backdrop-filter: blur(12px);
            transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(22, 123, 98, 0.35);
            box-shadow: 0 24px 60px rgba(31, 65, 55, 0.12);
        }

        .card:focus-visible {
            outline: 3px solid rgba(22, 123, 98, 0.28);
            outline-offset: 3px;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .port {
            color: var(--accent);
            font: 700 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--pending);
            font-size: 12px;
            font-weight: 700;
        }

        .status::before {
            width: 8px;
            height: 8px;
            content: "";
            background: currentColor;
            border-radius: 50%;
            box-shadow: 0 0 0 4px color-mix(in srgb, currentColor 14%, transparent);
        }

        .status.online { color: var(--online); }
        .status.offline { color: var(--offline); }

        h2 {
            margin: 34px 0 8px;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        .description {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .open {
            margin-top: auto;
            padding-top: 22px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 750;
        }

        footer {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            margin-top: 28px;
            color: var(--muted);
            font-size: 13px;
        }

        @media (max-width: 560px) {
            main { width: min(100% - 24px, 1080px); padding: 42px 0; }
            footer { flex-direction: column; gap: 6px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .card { transition: none; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">PGO Workspace</p>
            <h1>组件导航</h1>
            <p class="intro">从这里进入当前 Compose 环境的管理与观测界面。链接会自动沿用当前主机地址。</p>
        </header>

        <section class="grid" id="service-grid" aria-label="网页组件"></section>

        <footer>
            <span id="host-label"></span>
            <span>状态由当前浏览器探测</span>
        </footer>
    </main>

    <script>
        // 组件导航信息的单一维护入口。调整 Compose 宿主机端口时同步修改此处。
        const services = [
            { name: "后端 API", port: 20000, description: "后端 HTTP API 服务入口" },
            { name: "后端 pprof", port: 20002, path: "/debug/pprof/", description: "Go 运行时性能分析入口" },
            { name: "RabbitMQ", port: 25674, description: "队列、交换机与消息状态管理" },
            { name: "Swagger UI", port: 28080, description: "HTTP API 文档与在线调试" },
            { name: "Prometheus", port: 29090, description: "指标查询、目标状态与告警规则" },
            { name: "Grafana", port: 23000, description: "服务、主机与容器观测面板" },
            { name: "cAdvisor", port: 28081, description: "容器资源用量与运行指标" }
        ];

        const host = window.location.hostname;
        const grid = document.querySelector("#service-grid");
        document.querySelector("#host-label").textContent = `当前主机：${host}`;

        for (const service of services) {
            const url = `http://${host}:${service.port}${service.path || "/"}`;
            const card = document.createElement("a");
            card.className = "card";
            card.href = url;
            card.target = "_blank";
            card.rel = "noreferrer";
            card.innerHTML = `
                <div class="card-top">
                    <span class="port">:${service.port}</span>
                    <span class="status" aria-live="polite">检测中</span>
                </div>
                <h2>${service.name}</h2>
                <p class="description">${service.description}</p>
                <span class="open">打开组件 ↗</span>
            `;
            grid.appendChild(card);
            checkService(url, card.querySelector(".status"));
        }

        async function checkService(url, status) {
            const controller = new AbortController();
            const timer = window.setTimeout(() => controller.abort(), 3500);
            try {
                await fetch(url, { mode: "no-cors", cache: "no-store", signal: controller.signal });
                status.textContent = "可访问";
                status.classList.add("online");
            } catch (_) {
                status.textContent = "未响应";
                status.classList.add("offline");
            } finally {
                window.clearTimeout(timer);
            }
        }
    </script>
</body>
</html>
