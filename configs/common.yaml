T3: 33
T4: "44"

Http:
  Addr: "0.0.0.0:8000"
  Timeout: 1000

Grpc:
  Addr: "0.0.0.0:9000"
  Timeout: 1000

# 独立诊断端口只供容器网络内的 Prometheus 与运维 CLI 使用。
# Pprof 默认关闭，需要时显式改为 true，且不要将该端口暴露到公网。
Diagnostics:
  Enabled: true
  Addr: "0.0.0.0:19090"
  Pprof: false

Pgsql:
  Addr: "pgo-pgsql:5432"
  DbName: pgo
  User: pgo
  Password: pgo

Mysql:
  Addr: "pgo-mysql:3306"
  DbName: pgo
  User: root
  Password: root

Redis:
  Addr: "pgo-redis:6379"
  Password: pgo

RabbitMQ:
    Addr: "pgo-rabbitmq:5672"
    User: "pgo"
    Password: "pgo"
    VHost: "pgo_vhost"
    IsLogMessage: 1

APITable:
  token: ""
  baseUrl: ""
