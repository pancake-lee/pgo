T3: 33
T4: "44"

Http:
  Addr: "0.0.0.0:20000"
  Timeout: 1000

Grpc:
  Addr: "0.0.0.0:20001"
  Timeout: 1000

# 独立诊断端口只供容器网络内的 Prometheus 与运维 CLI 使用。
# Alloy 定时抓取 CPU/heap/goroutine；block/mutex 在测试期间开启采样。
# 诊断端口不得暴露到公网。
Diagnostics:
  Enabled: true
  Addr: "0.0.0.0:20002"
  Pprof: true
  # CPU 使用 net/http/pprof 固定的默认 100 Hz；MemProfileRate 为 0 时沿用 runtime 默认值。
  MemProfileRate: 0
  # block/mutex 在测试会话或单次 POST 采集期间使用以下采样参数。
  BlockProfileRate: 1
  MutexProfileFraction: 1

Pgsql:
  Addr: "pgo-pgsql:5432"
  DbName: pgo
  User: pgo
  Password: pgo

Mysql:
  Addr: "pgo-mysql:3306"
  DbName: pgo
  User: root
  Password: root
  # MaxOpenConns: 64
  # MaxIdleConns: 64

Redis:
  Addr: "pgo-redis:6379"
  Password: pgo

RabbitMQ:
    Addr: "pgo-rabbitmq:5672"
    User: "pgo"
    Password: "pgo"
    VHost: "pgo_vhost"
    IsLogMessage: 1

APITable:
  token: ""
  baseUrl: ""
